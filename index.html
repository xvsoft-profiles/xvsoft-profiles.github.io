<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<title>Xvsoft</title>

<style>
* {
  box-sizing: border-box;
  margin: 0;
  padding: 0;
}

body {
  min-height: 100vh;
  background: #111214;
  color: white;
  font-family: Arial, sans-serif;

  display: flex;
  justify-content: center;
  align-items: center;

  padding: 18px;
}

button,
input,
textarea,
select {
  font: inherit;
}

button {
  cursor: pointer;
}

#loading {
  color: #aaa;
  font-size: 17px;
}

#error {
  display: none;

  width: 100%;
  max-width: 430px;

  background: #1e1f22;
  color: #ff7777;

  padding: 22px;

  border-radius: 20px;

  text-align: center;

  word-break: break-word;
}


/* =========================================
   PANELS
========================================= */

.panel {
  display: none;

  width: 100%;
  max-width: 460px;

  background: #1e1f22;

  border-radius: 24px;

  padding: 26px;

  box-shadow:
    0 20px 60px rgba(0,0,0,.55);
}

.logo {
  font-size: 30px;
  font-weight: 700;

  margin-bottom: 5px;
}

.subtitle {
  color: #999;
  line-height: 1.5;

  margin-bottom: 22px;
}

label {
  display: block;

  color: #b8bbc5;

  font-size: .85rem;

  margin:
    14px
    0
    6px;
}

input,
textarea,
select {
  width: 100%;

  border: 1px solid #3a3d45;

  background: #2b2d31;

  color: white;

  padding: 11px 13px;

  border-radius: 12px;

  outline: none;
}

input:focus,
textarea:focus,
select:focus {
  border-color: #5865F2;
}

textarea {
  min-height: 100px;

  resize: vertical;
}

.primary {
  width: 100%;

  border: 0;

  background: #5865F2;

  color: white;

  padding: 13px;

  border-radius: 30px;

  font-weight: 600;

  margin-top: 20px;
}

.primary:hover {
  background: #4752c4;
}

.primary:disabled {
  opacity: .6;

  cursor: wait;
}

.secondary {
  width: 100%;

  border: 0;

  background: #3a3d45;

  color: white;

  padding: 13px;

  border-radius: 30px;

  font-weight: 600;

  margin-top: 10px;
}

.small-error {
  color: #ff7777;

  font-size: .85rem;

  margin-top: 10px;

  min-height: 18px;
}


/* =========================================
   AUTH
========================================= */

.tabs {
  display: flex;

  gap: 5px;

  padding: 4px;

  background: #151619;

  border-radius: 14px;

  margin-bottom: 20px;
}

.tabs button {
  flex: 1;

  border: 0;

  background: transparent;

  color: #999;

  padding: 10px;

  border-radius: 10px;

  font-weight: 600;
}

.tabs button.active {
  background: #5865F2;

  color: white;
}


/* =========================================
   PROFILE
========================================= */

.profile {
  display: none;

  width: 100%;

  max-width: 400px;

  border-radius: 24px;

  overflow: hidden;

  text-align: center;

  box-shadow:
    0 15px 40px rgba(0,0,0,.55);
}

.banner {
  height: 0;

  background:
    none
    center / cover
    no-repeat;

  position: relative;
}

.banner.has-banner {
  height: 200px;
}

.pfp {
  width: 110px;
  height: 110px;

  border-radius: 50%;

  border: 5px solid #1e1f22;

  position: absolute;

  left: 50%;

  bottom: -55px;

  transform:
    translateX(-50%);

  background: #2b2d31;

  object-fit: cover;
}

.banner:not(.has-banner) .pfp {
  top: 20px;

  bottom: auto;
}

.content {
  padding:
    70px
    20px
    25px;
}

.banner:not(.has-banner)
+ .content {

  padding-top:
    145px;
}

.name {
  font-size: 1.7rem;

  font-weight: 600;

  margin-bottom: 5px;
}

.pronouns {
  margin-bottom: 13px;
}

.about {
  background:
    rgba(0,0,0,.25);

  backdrop-filter:
    blur(30px);

  border-radius: 16px;

  padding:
    12px
    16px;

  font-size: .9rem;

  line-height: 1.6;

  text-align: left;

  white-space: pre-line;

  word-break: break-word;
}

.message-btn {
  display: inline-block;

  margin-top: 18px;

  padding: 14px;

  border-radius: 50%;

  background: #5865F2;

  transition:
    transform .15s;
}

.message-btn:hover {
  transform: scale(1.05);
}

.message-btn img {
  width: 28px;
  height: 28px;

  display: block;
}


/* =========================================
   EDIT BUTTON
========================================= */

#editBtn {
  display: none;

  position: fixed;

  top: 16px;
  right: 16px;

  z-index: 50;

  border:
    1px solid
    #4e5058;

  background:
    rgba(30,31,34,.92);

  color: white;

  padding:
    9px
    17px;

  border-radius: 30px;

  backdrop-filter:
    blur(10px);
}


/* =========================================
   EDIT MODAL
========================================= */

#editModal {
  display: none;

  position: fixed;

  inset: 0;

  z-index: 100;

  background:
    rgba(0,0,0,.72);

  backdrop-filter:
    blur(8px);

  justify-content: center;

  align-items: center;

  padding: 18px;
}

.modal-box {
  width: 100%;

  max-width: 470px;

  max-height: 90vh;

  overflow-y: auto;

  background: #1e1f22;

  border-radius: 22px;

  padding: 24px;

  box-shadow:
    0 20px 50px
    rgba(0,0,0,.8);
}

.modal-box h2 {
  margin-bottom: 18px;
}

.actions {
  display: flex;

  gap: 10px;

  margin-top: 20px;
}

.actions button {
  flex: 1;

  border: 0;

  padding: 12px;

  border-radius: 30px;

  font-weight: 600;
}

.save {
  background: #5865F2;

  color: white;
}

.cancel {
  background: #3a3d45;

  color: white;
}


/* =========================================
   PREVIEWS
========================================= */

.preview-banner {
  display: none;

  width: 100%;

  height: 150px;

  margin-top: 12px;

  border-radius: 14px;

  background:
    center / cover
    no-repeat;

  background-color:
    #111214;

  border:
    1px solid
    #3a3d45;
}

.preview-pfp {
  display: none;

  width: 100px;
  height: 100px;

  border-radius: 50%;

  object-fit: cover;

  margin:
    12px
    auto;
}


/* =========================================
   GRADIENT
========================================= */

.color-row {
  display: flex;

  gap: 10px;

  margin-bottom: 10px;
}

.color-input {
  height: 45px;

  padding: 3px;
}

.gradient-preview {
  width: 100%;

  height: 75px;

  border-radius: 14px;

  margin-top: 12px;

  border:
    1px solid
    #3a3d45;
}


/* =========================================
   URL HELP
========================================= */

.url-help {
  color: #777;

  font-size: .75rem;

  margin-top: 5px;

  line-height: 1.4;
}
</style>
</head>

      id="editPfpUrl"

    <!-- BANNER -->

    <label>

      placeholder="https://example.com/banner.gif"
    >


    <div

    ></div>


    <label>
      Discord ID
    </label>

    <input

    >


    <div class="actions">

        class="cancel"

        Cancel
      </button>

      <button
        id="saveEdit"
        class="save"
      >

    </div>

  </div>

/* =========================================
   IMAGE URL PREVIEWS
========================================= */

newPfpUrl.addEventListener(
  "input",
  () => {

    const url =
      newPfpUrl.value.trim();


    if (!url) {

      newPfpPreview.style.display =
        "none";

      newPfpPreview.removeAttribute(
        "src"
      );

      return;

    }


    newPfpPreview.src =
      url;

    newPfpPreview.style.display =
      "block";

  }
);


newBannerUrl.addEventListener(
  "input",
  () => {

    const url =
      newBannerUrl.value.trim();


    if (!url) {

      newBannerPreview.style.display =
        "none";

      newBannerPreview.style.backgroundImage =
        "none";

      return;

    }


    newBannerPreview.style.backgroundImage =
      `url("${url}")`;

    newBannerPreview.style.display =
      "block";

  }
);

/* =========================================
   AUTH ERRORS
========================================= */

function authErrorMessage(
  code
) {

  switch(code) {

    case "auth/email-already-in-use":
      return "That email already has an account.";

    case "auth/invalid-email":
      return "That email address is invalid.";

    case "auth/weak-password":
      return "Password must be at least 6 characters.";

    case "auth/invalid-credential":
      return "Incorrect email or password.";

    case "auth/too-many-requests":
      return "Too many attempts. Try again later.";

    default:
      return "Authentication failed.";

  }

}

/* =========================================
   CREATE PROFILE
========================================= */

createProfileBtn.addEventListener(
  "click",
  async () => {

    const user =
      auth.currentUser;


    if (!user) {

      createError.textContent =
        "You must be signed in.";

      return;

    }


    const username =
      newUsername.value.trim();


    if (
      !/^[a-zA-Z0-9_-]{3,24}$/.test(
        username
      )
    ) {

      createError.textContent =
        "Username must be 3-24 characters.";

      return;

    }


    try {

      createProfileBtn.disabled =
        true;

      createProfileBtn.textContent =
        "Saving profile...";


      const profileRef =
        doc(
          db,
          "profiles",
          username
        );


      const userRef =
        doc(
          db,
          "users",
          user.uid
        );


      /*
        Check whether the username
        already exists.
      */

      const profileCheck =
        await getDoc(
          profileRef
        );


      if (
        profileCheck.exists()
      ) {

        throw new Error(
          "USERNAME_TAKEN"
        );

      }


      /*
        Check whether this Firebase
        account already owns a profile.
      */

      const userCheck =
        await getDoc(
          userRef
        );


      if (
        userCheck.exists() &&
        userCheck.data().username
      ) {

        throw new Error(
          "PROFILE_EXISTS"
        );

      }


      /*
        Save profile.
        Images are simply URLs.
      */

      await runTransaction(
        db,
        async transaction => {

          const profileCheck =
            await transaction.get(
              profileRef
            );

          const userCheck =
            await transaction.get(
              userRef
            );


          if (
            profileCheck.exists()
          ) {

            throw new Error(
              "USERNAME_TAKEN"
            );

          }


          if (
            userCheck.exists() &&
            userCheck.data().username
          ) {

            throw new Error(
              "PROFILE_EXISTS"
            );

          }


          transaction.set(
            profileRef,
            {

              ownerUid:
                user.uid,

              name:
                newName.value.trim()
                || username,

              pronouns:
                newPronouns.value.trim(),

              about:
                newAbout.value,

              gradient:
                makeGradient(
                  newColor1.value,
                  newColor2.value,
                  newDirection.value
                ),

              discordId:
                newDiscord.value.trim(),

              pfp:
                newPfpUrl.value.trim(),

              banner:
                newBannerUrl.value.trim()

            }
          );


          transaction.set(
            userRef,
            {

              username:
                username

            }
          );

        }
      );


      /*
        SUCCESS
      */

      createProfileBtn.textContent =
        "Account saved ✓";

      createProfileBtn.style.background =
        "#3ba55d";


      setTimeout(
        () => {

          window.location.href =
            "?user=" +
            encodeURIComponent(
              username
            );

        },
        700
      );


    } catch(error) {

      console.error(error);


      if (
        error.message ===
        "USERNAME_TAKEN"
      ) {

        createError.textContent =
          "That username is already taken.";

      } else if (
        error.message ===
        "PROFILE_EXISTS"
      ) {

        createError.textContent =
          "This account already has a profile.";

      } else {

        createError.textContent =
          "Could not create profile: " +
          error.message;

      }


      createProfileBtn.disabled =
        false;

      createProfileBtn.textContent =
        "Create Xvsoft Profile";

      createProfileBtn.style.background =
        "";

    }

  }
);


/* =========================================
   LOAD PROFILE
========================================= */

async function loadProfile(
  username,
  currentUser
) {

  try {

    const profileRef =
      doc(
        db,
        "profiles",
        username
      );


    const snapshot =
      await getDoc(
        profileRef
      );


    if (!snapshot.exists()) {

      showError(
        'Profile "' +
        username +
        '" was not found.'
      );

      return;

    }


    const data =
      snapshot.data();


    nameElement.textContent =
      data.name ||
      username;


    pronouns.textContent =
      data.pronouns ||
      "";


    about.textContent =
      data.about ||
      "";


    /*
      PFP
    */

    if (data.pfp) {

      pfp.src =
        data.pfp;

      pfp.style.display =
        "block";

    } else {

      pfp.style.display =
        "none";

    }


    /*
      BANNER
    */

    if (data.banner) {

      banner.classList.add(
        "has-banner"
      );

      banner.style.backgroundImage =
        `url("${data.banner}")`;

    } else {

      banner.classList.remove(
        "has-banner"
      );

      banner.style.backgroundImage =
        "none";

    }


    /*
      GRADIENT
    */

    profile.style.background =
      data.gradient ||
      "linear-gradient(280deg,#EEBD89,#D13ABD)";


    /*
      DISCORD
    */

    if (data.discordId) {

      discord.href =
        "https://discord.com/users/" +
        data.discordId;

      discord.style.display =
        "inline-block";

    } else {

      discord.style.display =
        "none";

    }


    document.title =
      (data.name || username) +
      " | Xvsoft";


    hideEverything();

    profile.style.display =
      "block";


    /*
      OWNER CHECK
    */

    if (
      currentUser &&
      data.ownerUid ===
      currentUser.uid
    ) {

      editBtn.style.display =
        "block";

      prepareEditor(
        username,
        data
      );

    }

  } catch(error) {

    console.error(error);

    showError(
      "Firebase error: " +
      error.message
    );

  }

}


/* =========================================
   EDITOR
========================================= */

let editingUsername =
  null;


function prepareEditor(
  username,
  data
) {

  editingUsername =
    username;


  editUsername.value =
    username;

  editName.value =
    data.name || "";

  editPronouns.value =
    data.pronouns || "";

  editAbout.value =
    data.about || "";

  editDiscord.value =
    data.discordId || "";

  editPfpUrl.value =
    data.pfp || "";

  editBannerUrl.value =
    data.banner || "";


  /*
    Default colors.
    Existing gradient is preserved
    in the profile itself.
  */

  editColor1.value =
    "#EEBD89";

  editColor2.value =
    "#D13ABD";

  editDirection.value =
    "90deg";


  if (data.pfp) {

    editPfpPreview.src =
      data.pfp;

    editPfpPreview.style.display =
      "block";

  } else {

    editPfpPreview.style.display =
      "none";

  }


  if (data.banner) {

    editBannerPreview.style.backgroundImage =
      `url("${data.banner}")`;

    editBannerPreview.style.display =
      "block";

  } else {

    editBannerPreview.style.display =
      "none";

  }


  updateEditGradient();

}

/* =========================================
   SAVE EDIT
========================================= */

saveEdit.addEventListener(
  "click",
  async () => {

    const user =
      auth.currentUser;


    if (
      !user ||
      !editingUsername
    )
      return;


    try {

      saveEdit.disabled =
        true;

      saveEdit.textContent =
        "Saving...";


      const profileRef =
        doc(
          db,
          "profiles",
          editingUsername
        );


      const current =
        await getDoc(
          profileRef
        );


      if (!current.exists()) {

        throw new Error(
          "Profile no longer exists."
        );

      }


      const currentData =
        current.data();


      /*
        Owner security check.
      */

      if (
        currentData.ownerUid !==
        user.uid
      ) {

        throw new Error(
          "You do not own this profile."
        );

      }


      const updates = {

        name:
          editName.value.trim(),

        pronouns:
          editPronouns.value.trim(),

        about:
          editAbout.value,

        gradient:
          makeGradient(
            editColor1.value,
            editColor2.value,
            editDirection.value
          ),

        discordId:
          editDiscord.value.trim(),

        pfp:
          editPfpUrl.value.trim(),

        banner:
          editBannerUrl.value.trim()

      };


      await setDoc(
        profileRef,
        updates,
        {
          merge: true
        }
      );


      editModal.style.display =
        "none";


      await loadProfile(
        editingUsername,
        user
      );


    } catch(error) {

      console.error(error);

      alert(
        "Could not save profile:\n\n" +
        error.message
      );

    } finally {

      saveEdit.disabled =
        false;

      saveEdit.textContent =
        "Save";

    }

  }
);

document

  )

/* =========================================
   AUTH STATE
========================================= */

onAuthStateChanged(
  auth,
  async user => {

    /*
      If a profile is explicitly
      requested, load it.
    */

    if (requestedUsername) {

      await loadProfile(
        requestedUsername,
        user
      );

      return;

    }


    /*
      Not logged in.
    */

    if (!user) {

      hideEverything();

      authPage.style.display =
        "block";

      return;

    }


    /*
      Logged in.
      Check whether they have
      an Xvsoft profile.
    */

    try {

      const userRef =
        doc(
          db,
          "users",
          user.uid
        );


      const userSnapshot =
        await getDoc(
          userRef
        );


      if (
        userSnapshot.exists() &&
        userSnapshot.data().username
      ) {

        const username =
          userSnapshot.data().username;


        window.location.href =
          "?user=" +
          encodeURIComponent(
            username
          );

      } else {

        hideEverything();

        createPage.style.display =
          "block";

      }

    } catch(error) {

      console.error(error);

      showError(
        "Could not load account: " +
        error.message
      );

    }

  }
);
