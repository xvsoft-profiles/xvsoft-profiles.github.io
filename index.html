========================================= */

  background: #1e1f22;
  border-radius: 24px;

label {

}

input,
textarea,

  border: 1px solid #3a3d45;
  background: #2b2d31;
  color: white;
  padding: 11px 13px;
  border-radius: 12px;

}

input:focus,

textarea {

.primary {

  padding: 13px;
  border-radius: 30px;
  font-weight: 600;
  margin-top: 20px;

.secondary {

/* =========================================
   IMAGE PROCESSING
========================================= */

async function processImage(
  file,
  maxDimension
) {

  if (!file)
    return null;


  return new Promise(
    (resolve, reject) => {

      const reader =
        new FileReader();

      const image =
        new Image();


      reader.onload =
        event => {

          image.src =
            event.target.result;

        };


      reader.onerror =
        () => reject(
          new Error(
            "Could not read image."
          )
        );


      image.onload =
        () => {

          let width =
            image.naturalWidth;

          let height =
            image.naturalHeight;


          const scale =
            Math.min(
              1,
              maxDimension /
              Math.max(
                width,
                height
              )
            );


          width =
            Math.round(
              width * scale
            );

          height =
            Math.round(
              height * scale
            );


          const canvas =
            document.createElement(
              "canvas"
            );


          canvas.width =
            width;

          canvas.height =
            height;


          const context =
            canvas.getContext(
              "2d"
            );


          context.drawImage(
            image,
            0,
            0,
            width,
            height
          );


          canvas.toBlob(
            blob => {

              if (!blob) {

                reject(
                  new Error(
                    "Could not compress image."
                  )
                );

                return;

              }

              resolve(blob);

            },
            "image/webp",
            0.85
          );

        };


      image.onerror =
        () => reject(
          new Error(
            "Invalid image."
          )
        );


      reader.readAsDataURL(file);

    }
  );

}


/* =========================================
   UPLOAD TO FIREBASE STORAGE
========================================= */

async function uploadImage(
  file,
  path,
  maxDimension
) {

  if (!file)
    return "";


  const blob =
    await processImage(
      file,
      maxDimension
    );


  /*
    ACTUAL IMAGE FILE goes here.
    Firestore does NOT store the image.
  */

  const storageRef =
    ref(
      storage,
      path
    );


  await uploadBytes(
    storageRef,
    blob,
    {
      contentType:
        "image/webp"
    }
  );


  /*
    Firestore stores this URL,
    which points back to the actual
    image in Firebase Storage.
  */

  return await getDownloadURL(
    storageRef
  );

}


/* =========================================
   PREVIEWS
========================================= */

function setupPreview(
  input,
  preview,
  maxDimension
) {

  input.addEventListener(
    "change",
    async () => {

      const file =
        input.files[0];

      if (!file)
        return;


      try {

        const blob =
          await processImage(
            file,
            maxDimension
          );


        preview.src =
          URL.createObjectURL(
            blob
          );


        preview.style.display =
          "block";


      } catch (error) {

        alert(
          error.message
        );

      }

    }
  );

}

/* =========================================
   AUTH ERROR
========================================= */

function authErrorMessage(code) {

  switch(code) {

    case "auth/email-already-in-use":
      return "That email already has an account.";

    case "auth/invalid-email":
      return "That email address is invalid.";

    case "auth/weak-password":
      return "Password must be at least 6 characters.";

    case "auth/invalid-credential":
      return "Incorrect email or password.";

    case "auth/too-many-requests":
      return "Too many attempts. Try again later.";

    default:
      return "Authentication failed.";

  }

}

/* =========================================
   CREATE PROFILE
========================================= */

createProfileBtn.addEventListener(
  "click",
  async () => {

    const user =
      auth.currentUser;


    if (!user) {

      createError.textContent =
        "You must be signed in.";

      return;

    }


    const username =
      newUsername.value.trim();


    if (
      !/^[a-zA-Z0-9_-]{3,24}$/.test(
        username
      )
    ) {

      createError.textContent =
        "Username must be 3-24 characters.";

      return;

    }


    try {

      createProfileBtn.disabled =
        true;

      createProfileBtn.textContent =
        "Uploading images...";


      const profileRef =
        doc(
          db,
          "profiles",
          username
        );


      const userRef =
        doc(
          db,
          "users",
          user.uid
        );


      /*
        CHECK EVERYTHING BEFORE
        UPLOADING.
      */

      const existingProfile =
        await getDoc(
          profileRef
        );

      if (
        existingProfile.exists()
      ) {

        throw new Error(
          "USERNAME_TAKEN"
        );

      }


      const existingUser =
        await getDoc(
          userRef
        );

      if (
        existingUser.exists() &&
        existingUser.data().username
      ) {

        throw new Error(
          "PROFILE_EXISTS"
        );

      }


      /*
        UPLOAD THE ACTUAL FILES.
      */

      let pfpUrl = "";

      let bannerUrl = "";


      if (
        newPfpFile.files[0]
      ) {

        createProfileBtn.textContent =
          "Uploading profile picture...";


        pfpUrl =
          await uploadImage(
            newPfpFile.files[0],
            "profiles/" +
            user.uid +
            "/pfp.webp",
            480
          );

      }


      if (
        newBannerFile.files[0]
      ) {

        createProfileBtn.textContent =
          "Uploading banner...";


        bannerUrl =
          await uploadImage(
            newBannerFile.files[0],
            "profiles/" +
            user.uid +
            "/banner.webp",
            1280
          );

      }


      /*
        ONLY NOW CREATE FIRESTORE DATA.
      */

      createProfileBtn.textContent =
        "Saving profile...";


      await runTransaction(
        db,
        async transaction => {

          const profileCheck =
            await transaction.get(
              profileRef
            );

          const userCheck =
            await transaction.get(
              userRef
            );


          if (
            profileCheck.exists()
          ) {

            throw new Error(
              "USERNAME_TAKEN"
            );

          }


          if (
            userCheck.exists() &&
            userCheck.data().username
          ) {

            throw new Error(
              "PROFILE_EXISTS"
            );

          }


          transaction.set(
            profileRef,
            {

              ownerUid:
                user.uid,

              name:
                newName.value.trim()
                || username,

              pronouns:
                newPronouns.value.trim(),

              about:
                newAbout.value,

              gradient:
                makeGradient(
                  newColor1.value,
                  newColor2.value,
                  newDirection.value
                ),

              discordId:
                newDiscord.value.trim(),

              /*
                These are URLs pointing
                to the actual files in
                Firebase Storage.
              */

              pfp:
                pfpUrl,

              banner:
                bannerUrl

            }
          );


          transaction.set(
            userRef,
            {
              username:
                username
            }
          );

        }
      );


      /*
        EVERYTHING succeeded.
      */

      createProfileBtn.textContent =
        "Account saved ✓";


      createProfileBtn.style.background =
        "#3ba55d";


      setTimeout(
        () => {

          window.location.href =
            "?user=" +
            encodeURIComponent(
              username
            );

        },
        700
      );


    } catch(error) {

      console.error(error);


      if (
        error.message ===
        "USERNAME_TAKEN"
      ) {

        createError.textContent =
          "That username is already taken.";

      } else if (
        error.message ===
        "PROFILE_EXISTS"
      ) {

        createError.textContent =
          "This account already has a profile.";

      } else {

        createError.textContent =
          "Could not create profile: " +
          error.message;

      }


      createProfileBtn.disabled =
        false;

      createProfileBtn.textContent =
        "Create Xvsoft Profile";

      createProfileBtn.style.background =
        "";

    }

  }
);


/* =========================================
   LOAD PROFILE
========================================= */

async function loadProfile(
  username,
  currentUser
) {

  try {

    const profileRef =
      doc(
        db,
        "profiles",
        username
      );


    const snapshot =
      await getDoc(
        profileRef
      );


    if (!snapshot.exists()) {

      showError(
        'Profile "' +
        username +
        '" was not found.'
      );

      return;

    }


    const data =
      snapshot.data();


    nameElement.textContent =
      data.name ||
      username;


    pronouns.textContent =
      data.pronouns ||
      "";


    about.textContent =
      data.about ||
      "";


    /*
      PFP
    */

    if (data.pfp) {

      pfp.src =
        data.pfp;

      pfp.style.display =
        "block";

    } else {

      pfp.style.display =
        "none";

    }


    /*
      BANNER
    */

    if (data.banner) {

      banner.classList.add(
        "has-banner"
      );

      banner.style.backgroundImage =
        `url("${data.banner}")`;

    } else {

      banner.classList.remove(
        "has-banner"
      );

      banner.style.backgroundImage =
        "none";

    }


    /*
      GRADIENT
    */

    profile.style.background =
      data.gradient ||
      "linear-gradient(280deg,#EEBD89,#D13ABD)";


    /*
      DISCORD
    */

    if (data.discordId) {

      discord.href =
        "https://discord.com/users/" +
        data.discordId;

      discord.style.display =
        "inline-block";

    } else {

      discord.style.display =
        "none";

    }


    document.title =
      (data.name || username) +
      " | Xvsoft";


    hideEverything();

    profile.style.display =
      "block";


    /*
      OWNER CHECK
    */

    if (
      currentUser &&
      data.ownerUid ===
      currentUser.uid
    ) {

      editBtn.style.display =
        "block";

      prepareEditor(
        username,
        data
      );

    }

  } catch(error) {

    console.error(error);

    showError(
      "Firebase error: " +
      error.message
    );

  }

}


/* =========================================
   EDITOR
========================================= */

let editingUsername = null;


function prepareEditor(
  username,
  data
) {

  editingUsername =
    username;


  editUsername.value =
    username;

  editName.value =
    data.name || "";

  editPronouns.value =
    data.pronouns || "";

  editAbout.value =
    data.about || "";

  editDiscord.value =
    data.discordId || "";


  editColor1.value =
    "#EEBD89";

  editColor2.value =
    "#D13ABD";

  editDirection.value =
    "90deg";


  if (data.pfp) {

    editPfpPreview.src =
      data.pfp;

    editPfpPreview.style.display =
      "block";

  } else {

    editPfpPreview.style.display =
      "none";

  }


  if (data.banner) {

    editBannerPreview.src =
      data.banner;

    editBannerPreview.style.display =
      "block";

  } else {

    editBannerPreview.style.display =
      "none";

  }


  updateEditGradient();

}

/* =========================================
   SAVE EDIT
========================================= */

saveEdit.addEventListener(
  "click",
  async () => {

    const user =
      auth.currentUser;


    if (
      !user ||
      !editingUsername
    )
      return;


    try {

      saveEdit.disabled =
        true;

      saveEdit.textContent =
        "Saving...";


      const profileRef =
        doc(
          db,
          "profiles",
          editingUsername
        );


      const current =
        await getDoc(
          profileRef
        );


      if (!current.exists()) {

        throw new Error(
          "Profile no longer exists."
        );

      }


      const currentData =
        current.data();


      /*
        CLIENT-SIDE OWNER CHECK.
      */

      if (
        currentData.ownerUid !==
        user.uid
      ) {

        throw new Error(
          "You do not own this profile."
        );

      }


      const updates = {

        name:
          editName.value.trim(),

        pronouns:
          editPronouns.value.trim(),

        about:
          editAbout.value,

        gradient:
          makeGradient(
            editColor1.value,
            editColor2.value,
            editDirection.value
          ),

        discordId:
          editDiscord.value.trim()

      };


      /*
        UPLOAD NEW PFP
      */

      if (
        editPfpFile.files[0]
      ) {

        saveEdit.textContent =
          "Uploading PFP...";


        updates.pfp =
          await uploadImage(
            editPfpFile.files[0],
            "profiles/" +
            user.uid +
            "/pfp.webp",
            480
          );

      }


      /*
        UPLOAD NEW BANNER
      */

      if (
        editBannerFile.files[0]
      ) {

        saveEdit.textContent =
          "Uploading banner...";


        updates.banner =
          await uploadImage(
            editBannerFile.files[0],
            "profiles/" +
            user.uid +
            "/banner.webp",
            1280
          );

      }


      saveEdit.textContent =
        "Saving...";


      await setDoc(
        profileRef,
        updates,
        {
          merge: true
        }
      );


      editModal.style.display =
        "none";


      await loadProfile(
        editingUsername,
        user
      );


    } catch(error) {

      console.error(error);

      alert(
        "Could not save profile:\n\n" +
        error.message
      );

    } finally {

      saveEdit.disabled =
        false;

      saveEdit.textContent =
        "Save";

    }

  }
);

/* =========================================
   AUTH STATE
========================================= */

onAuthStateChanged(
  auth,
  async user => {

    /*
      If ?user= exists,
      ALWAYS load that profile.

      No hard-coded username.
    */

    if (requestedUsername) {

      await loadProfile(
        requestedUsername,
        user
      );

      return;

    }


    /*
      No selected profile.
    */

    if (!user) {

      hideEverything();

      authPage.style.display =
        "block";

      return;

    }


    /*
      Logged-in user.
      Find their profile.
    */

    try {

      const userRef =
        doc(
          db,
          "users",
          user.uid
        );


      const userSnapshot =
        await getDoc(
          userRef
        );


      if (
        userSnapshot.exists() &&
        userSnapshot.data().username
      ) {

        window.location.href =
          "?user=" +
          encodeURIComponent(
            userSnapshot.data().username
          );

      } else {

        hideEverything();

        createPage.style.display =
          "block";

      }

    } catch(error) {

      console.error(error);

      showError(
        "Could not load account: " +
        error.message
      );

    }

  }
);
